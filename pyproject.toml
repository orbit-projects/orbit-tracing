[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbit-tracing"
version = "0.1.0a1"
description = "OpenTelemetry tracing adapter for Orbit Core."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "orbit-core>=0.1.0a1,<0.2",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
otlp-http = ["opentelemetry-exporter-otlp-proto-http>=1.45,<2"]
otlp-grpc = ["opentelemetry-exporter-otlp-proto-grpc>=1.45,<2"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "orbit-testing>=0.1.0a1,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_tracing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orbit_tracing"]
